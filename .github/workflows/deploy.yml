name: Pubblica Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installa le dipendenze
        run: flutter pub get

      - name: Compila Flutter Web
        run: flutter build web --release --base-href "/progetto-mentore/"

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito compilato
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
