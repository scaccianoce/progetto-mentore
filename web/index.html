<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="prog_mentore">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/favicon.png"/>

  <title>prog_mentore</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Firebase inoltra i messaggi alla pagina quando la PWA e' in primo piano.
    // In quel caso il browser non crea automaticamente una notifica di sistema,
    // quindi Flutter richiama questa funzione per mostrarla tramite il worker.
    window.mentoreMostraNotifica = async function (titolo, messaggio, link) {
      if (!('serviceWorker' in navigator) || !('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;

      const scopeFirebase = new URL(
        'firebase-cloud-messaging-push-scope/',
        document.baseURI
      );
      const registrazioneFirebase = await navigator.serviceWorker
        .getRegistration(scopeFirebase.href);
      const registrazione = registrazioneFirebase ||
        await navigator.serviceWorker.ready;
      const icona = new URL('icons/Icon-192.png', document.baseURI).href;
      const destinazione = new URL(
        link || './#/notifiche',
        document.baseURI
      ).href;

      await registrazione.showNotification(
        titolo || 'Progetto Mentore',
        {
          body: messaggio || 'Hai ricevuto una nuova notifica.',
          icon: icona,
          badge: icona,
          data: { link: destinazione }
        }
      );
    };
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
